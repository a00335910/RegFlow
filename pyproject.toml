[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "regflow"
version = "0.1.0"
description = "Event-driven regulatory compliance system with correction-retrieval-augmented agents (RegFlow v2.3)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "RegFlow" }]

dependencies = [
    # Orchestration
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "langchain-community>=0.3.10",
    "prefect>=3.0.0",

    # LLM provider abstraction (Ollama local + vLLM/OpenAI-compatible remote)
    "litellm>=1.55.0",
    "ollama>=0.4.0",

    # Embeddings
    "sentence-transformers>=3.3.0",
    "torch>=2.4.0",

    # Vector store
    "weaviate-client>=4.9.0",

    # Knowledge graph
    "neo4j>=5.25.0",

    # Relational + object stores
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "minio>=7.2.0",

    # API layer
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # UI layer
    "gradio>=4.0.0",

    # Ingestion
    "httpx>=0.28.0",
    "lxml>=5.3.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=5.1.0",
    "feedparser>=6.0.11",

    # Observability
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "langfuse>=2.50.0",

    # Utilities
    "pyyaml>=6.0.2",
    "tenacity>=9.0.0",
    "python-dateutil>=2.9.0",
    "deepdiff>=8.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "ipython>=8.30.0",
]

[project.scripts]
regflow = "regflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/regflow"]

[tool.hatch.build.targets.wheel.sources]
"src" = "regflow"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "unit: fast isolated tests",
    "integration: require docker services",
    "e2e: full pipeline tests",
]
