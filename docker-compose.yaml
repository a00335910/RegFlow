name: regflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: regflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: regflow
      POSTGRES_PASSWORD: regflow_dev
      POSTGRES_DB: regflow
    ports:
      - "5433:5432"      # host 5433 -> container 5432 (host 5432 taken by Safekube/local PG)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regflow -d regflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.25-community
    container_name: regflow-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/regflow_dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.6
    container_name: regflow-weaviate
    restart: unless-stopped
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none      # we supply our own vectors (sentence-transformers / BGE-M3)
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: node1
    ports:
      - "8080:8080"   # REST
      - "50051:50051" # gRPC
    volumes:
      - weaviate_data:/var/lib/weaviate
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/v1/.well-known/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: regflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: regflow
      MINIO_ROOT_PASSWORD: regflow_dev_minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------------
  # Langfuse — open-source LLM observability. Separate Postgres so its data is
  # isolated from the application DB and can be wiped independently.
  # ------------------------------------------------------------------------
  langfuse-db:
    image: postgres:16-alpine
    container_name: regflow-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_dev
      POSTGRES_DB: langfuse
    ports:
      - "5434:5432"   # host 5434 so it doesn't collide with the app DB on 5433
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    container_name: regflow-langfuse
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse_dev@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: dev_not_secure_change_for_prod_min_32_chars__
      SALT: dev_not_secure_change_for_prod_min_32_chars__
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/public/health"]
      interval: 15s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:0.24.0   # cloud-models + `ollama signin` require >= 0.5
    container_name: regflow-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU passthrough (uncomment if NVIDIA GPU + nvidia-container-toolkit installed):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  weaviate_data:
  minio_data:
  ollama_data:
  langfuse_db_data:
